name: build
on:
  push:
    branches: [main]
  workflow_dispatch:        # build ブランチを直したときは手で回す

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  b:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: build, path: .build }
      - run: python3 .build/build.py --src . --out dist
      # 外の css が取れるか。取れないまま配ると、素の HTML が黙って公開される
      - name: css
        run: |
          urls=$(grep -oh 'href="https\?://[^"]*\.css"' dist/*.html | cut -d'"' -f2 | sort -u || true)
          if [ -z "$urls" ]; then
            echo "::error::@css が1つも無い"
            exit 1
          fi
          for u in $urls; do
            if curl -sfI --retry 3 --retry-delay 2 "$u" >/dev/null; then
              echo "ok  $u"
            else
              echo "::error::css が取れない … $u"
              exit 1
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
